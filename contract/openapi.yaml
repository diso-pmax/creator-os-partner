webhooks:
  settlementDelivery:
    post:
      tags:
        - settlement
      operationId: settlementDelivery
      summary: We call YOUR endpoint with one settled point amount
      description: "SETTLEMENT channel (PartnerSettlementSignatureV1). Signing string: `<X-Platform-Timestamp>.POST.<path and query exactly as on the request line>.<raw body>`, key looked up by X-Platform-Key-Id. See settlement.md and the SETTLEMENT cases of the conformance suite (testing.md)."
      security:
        - settlementHmac: []
      parameters:
        - name: X-Platform-Key-Id
          in: header
          required: true
          schema:
            type: string
        - name: X-Platform-Timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: ^\d{1,12}$
        - name: X-Platform-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: ^sha256=[0-9a-f]{64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementPacket"
      responses:
        "401":
          description: Bad signature, unknown key id or stale timestamp. We do not retry automatically.
        "409":
          description: 'deliveryNonce already seen. Answer 409 for a repeated nonce: on a repeat sent by our "ask again" we read it as "already received"; on a first delivery it is recorded as rejected.'
        "422":
          description: Business rejection, for example deliveryNonce missing from the signed body. Recorded as rejected by the partner.
        2XX:
          description: Received.
components:
  securitySchemes:
    eventHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: EVENT channel HMAC, see event-ingestion.md.
    launchHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: LAUNCH channel HMAC (a different secret from EVENT), see campaign-launch.md.
    settlementHmac:
      type: apiKey
      in: header
      name: X-Platform-Signature
      description: SETTLEMENT channel HMAC, see settlement.md.
  schemas:
    PartnerEvent:
      type: object
      properties:
        specversion:
          anyOf:
            - type: string
              enum:
                - "1.0"
            - type: "null"
        eventId:
          type: string
          minLength: 1
          maxLength: 200
        externalUserId:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          minLength: 1
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
        seq:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
        confidence:
          type: string
          enum:
            - CLIENT_ASSERTED
            - SERVER_OBSERVED
            - SETTLED
        payload: {}
      required:
        - eventId
        - type
        - occurredAt
      additionalProperties: true
      title: PartnerEvent
      description: Body of POST /integrations/events (and each element of a batch).
      x-serverSideChecks:
        - type must be one of the event types declared for your key; otherwise 422 event_type_not_registered
        - occurredAt freshness window (422 event_too_late / event_from_future)
        - externalUserId is required for the regular event types; LINK_* events instead require the PROGRAM_LINK 1.0 conversion profile in payload, with eventId, type and occurredAt matching the conversion
        - unknown top-level fields are ignored, not rejected (additionalProperties is true on purpose)
    PartnerEventBatch:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/PartnerEvent"
          minItems: 1
      required:
        - events
      additionalProperties: false
      title: PartnerEventBatch
      description: Body of POST /integrations/events/batch.
      x-serverSideChecks:
        - each element of events is validated as PartnerEvent on its own, and answered per element
        - the batch size and byte limits are per integration (422 batch_not_enabled, 413 batch_too_large, 413 payload_too_large)
    DeliveryLookup:
      type: object
      properties:
        deliveryId:
          type: string
          minLength: 1
          maxLength: 64
        externalId:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
      title: DeliveryLookup
      description: "Body of POST /integrations/deliveries: look up the receipt of an event."
      x-serverSideChecks:
        - send EXACTLY ONE of deliveryId or externalId; sending both or neither is a 400
    ReconciliationQuery:
      type: object
      properties:
        eventSource:
          type: string
          minLength: 1
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
      required:
        - eventSource
        - from
        - to
      additionalProperties: false
      title: ReconciliationQuery
      description: Body of POST /integrations/reconciliation.
      x-serverSideChecks:
        - to must be after from
        - the range is at most 30 days per call
    CreateLaunch:
      type: object
      properties:
        externalUserId:
          type: string
          minLength: 1
        displayName:
          anyOf:
            - type: string
              maxLength: 256
            - type: "null"
        segments:
          anyOf:
            - type: array
              items:
                type: string
                maxLength: 40
                pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            - type: "null"
      required:
        - externalUserId
      additionalProperties: false
      title: CreateLaunch
      description: Body of POST /campaigns/{campaignId}/launch. campaignId is in the path, never in the body.
      x-serverSideChecks:
        - "displayName is only a SUGGESTION: a value that fails the naming policy is dropped, the launch still succeeds"
        - "segments: every element must be a slug (lower-case words joined by single hyphens, at most 40 characters); one wrong element refuses the whole call with 400 and creates no ticket; at most 10 distinct slugs per call (duplicates are dropped before counting)"
        - "segments: a well-formed slug that Diso has not declared for YOUR integration (or has archived) does NOT fail the call: the launch succeeds and that group is simply not applied"
        - "segments only ever ADD groups to the player: absent, null and [] change nothing, and no launch can remove a group; a player carries at most 30 groups, and a call that would pass 30 adds none of its new groups"
    SettlementPacket:
      type: object
      properties:
        settlementRef:
          type: string
          minLength: 1
        campaignId:
          type: string
          minLength: 1
        settlementItemId:
          type: string
          minLength: 1
        partyId:
          type: string
          minLength: 1
        externalUserId:
          type: string
          minLength: 1
        denominationCode:
          type: string
          minLength: 1
        pointAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        exchangeRateSnapshot:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        moneyAmount:
          type: string
          pattern: ^-?\d+(\.\d+)?$
        moneyCurrency:
          type: string
          pattern: ^[A-Z]{3}$
        deliveryNonce:
          type: string
          minLength: 1
      required:
        - settlementRef
        - settlementItemId
        - partyId
        - denominationCode
        - pointAmount
        - exchangeRateSnapshot
        - moneyAmount
        - moneyCurrency
        - deliveryNonce
      additionalProperties: true
      title: SettlementPacket
      description: "The packet WE send to your settlement endpoint (see webhooks.settlementDelivery). Ignore fields you do not recognize: we may add fields without a new contract version."
      x-serverSideChecks:
        - "amounts are decimal strings, already settled and frozen: do not recompute them"
        - deliveryNonce is new on every real call; you MUST reject a nonce you have already seen (409)
    LaunchCreated:
      type: object
      required:
        - launchUrl
        - expiresAt
      properties:
        launchUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    BusinessError:
      type: object
      description: Shape of business errors; see error-codes.md for every code.
      required:
        - code
        - status
      properties:
        code:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        details:
          type: object
          additionalProperties: true
    AuthError:
      type: object
      description: Shape of 401 bodies. There is NO `code` field.
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
