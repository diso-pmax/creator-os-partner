      tags:
        - launch
      operationId: createLaunch
      summary: Create a single-use launch URL for one player
      description: "LAUNCH channel, server-to-server only. Signing string: `<X-Timestamp>.<raw body>` with the LAUNCH secret. See campaign-launch.md."
